name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign APK with v1+v2 schemes (MIUI/Xiaomi compatibility)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d -name "[0-9]*" | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          echo "Using build-tools: $BT"
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Single apksigner pass applying v1+v2 (v1 required for MIUI/Xiaomi installers)
          "$APKSIGNER" sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$APK.signed" "$APK" && mv "$APK.signed" "$APK"
          # Diagnostics: show what's actually in the APK
          echo "=== META-INF contents ==="
          unzip -l "$APK" | grep -i "META-INF/" | head -20
          echo "=== apksigner verify ==="
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -20
          # Hard requirement: v1 (JAR) signature files must exist
          unzip -l "$APK" | grep -qiE "META-INF/.+\.(RSA|DSA|EC)$" && echo "v1 (JAR) signature: PRESENT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APKs (split per ABI for smaller downloads)
        # LLM_API_KEY etc. come from repo secrets; when unset the app simply
        # runs the AI assistant in offline rule-based mode (build never fails).
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          --dart-define=LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          --dart-define=LLM_MODEL=${{ secrets.LLM_MODEL }}

      - name: Verify APK signatures (v1+v2)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d -name "[0-9]*" | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $APK"
            "$BT/apksigner" verify "$APK" && echo "apksigner verify: OK"
            unzip -l "$APK" | grep -qiE "META-INF/.+\.(RSA|DSA|EC)$" && echo "v1 (JAR) signature: PRESENT"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

name: kharcha
description: "Kharcha — দৈনিক খরচের হিসাব (Daily Expense Tracker). A simple offline expense tracker with Bangla + English UI."
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  # Pinned below 1.0: fl_chart 1.x is a full API rewrite.
  fl_chart: ">=0.68.0 <1.0.0"
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png

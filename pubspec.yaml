name: kharcha
description: "Kharcha — দৈনিক খরচের হিসাব (Daily Expense Tracker). A simple offline expense tracker with Bangla + English UI."
publish_to: "none"
version: 0.2.1+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  # Pinned below 1.0: fl_chart 1.x is a full API rewrite.
  fl_chart: ">=0.68.0 <1.0.0"
  intl: ^0.20.2
  # UUID v4 ids shared between SQLite and Firestore (v3.0 sync).
  uuid: ^4.5.0
  # Firebase (v3.0): auth + per-user cloud sync. Versions resolved by `flutter pub get` on CI.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  googleapis: ^14.0.0 # Drive appDataFolder auto-backup
  geolocator: ^13.0.0
  flutter_map: ^6.1.0 # location reminders
  latlong2: ^0.9.1 # direct dep: LatLng for expense map (flutter_map v6 does not re-export)
  # SDK-bundled localizations (v4): enables the Bangla Material calendar/date picker.
  flutter_localizations:
    sdk: flutter
  # v4 system features: notifications, SMS auto-detect, app lock, export,
  # backup/restore, in-app updates. Versions verified on pub.dev (2026-10-03)
  # against Dart ^3.4 / current Flutter stable.
  image_picker: ^1.2.3 # receipt photo (Agent B)
  speech_to_text: ^7.5.0 # voice input (Agent B)
  flutter_tts: ^4.2.0 # voice report answers
  google_mlkit_text_recognition: ^0.15.0 # bill/receipt OCR scanning (v5)
  receive_sms: ^1.3.1 # incoming-SMS stream (modern, AGP8 namespace OK)
  permission_handler: ^13.0.2 # runtime SMS permission
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0 # device IANA zone for tz-aware scheduling
  local_auth: ^2.3.0 # fingerprint unlock
  flutter_secure_storage: ^9.2.4 # PIN hash storage
  crypto: ^3.0.7 # SHA-256 PIN hashing
  pdf: ^3.11.1
  excel: ^4.0.6
  share_plus: ^12.0.0
  file_picker: ^8.3.7
  package_info_plus: ^9.0.1 # current version for update checks
  open_filex: ^4.7.0 # trigger APK install (ships its own FileProvider)
  home_widget: ^0.9.0 # home-screen expense widgets (v6)
  http: ^1.6.0 # GitHub releases API + APK download
  workmanager: ^0.9.0 # periodic background update checks
  shared_preferences: ^2.5.3 # last-notified update tag (main + background)
  table_calendar: ^3.1.2 # calendar view for expenses (v6)
  flutter_staggered_grid_view: ^0.7.0 # masonry grid for notes

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    # Bundled for PDF export: stock PDF fonts have no Bengali glyphs.
    - assets/fonts/NotoSansBengali.ttf
